name: Idea
description: Suggest a change or a new feature
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What gets in your way?
      description: The problem, in your day-to-day use, that this would solve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches welcome.
