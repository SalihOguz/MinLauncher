name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # With the repository's release key in its secrets, APKs are signed with it; without
      # (forks, pull requests), with the public debug key.
      - name: Release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MINLAUNCHER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          MINLAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MINLAUNCHER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MINLAUNCHER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "MinLauncher-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MinLauncher-${{ github.run_number }}
          path: MinLauncher-${{ github.run_number }}.apk

      # A version tag (v1.0.0) makes a proper release with the APK and generated notes. A release
      # drafted on GitHub's website for that tag gets the APK added to it instead.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="MinLauncher-${GITHUB_REF_NAME}.apk"
          cp "MinLauncher-${{ github.run_number }}.apk" "$apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "MinLauncher ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      # A single rolling pre-release, so the newest APK is always one tap away on the phone.
      - name: Update dev-build release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build "MinLauncher-${{ github.run_number }}.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download the APK on your phone and install it."
