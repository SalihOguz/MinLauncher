name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "MinLauncher-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MinLauncher-${{ github.run_number }}
          path: MinLauncher-${{ github.run_number }}.apk

      # A single rolling pre-release, so the newest APK is always one tap away on the phone.
      - name: Update dev-build release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build "MinLauncher-${{ github.run_number }}.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download the APK on your phone and install it."
